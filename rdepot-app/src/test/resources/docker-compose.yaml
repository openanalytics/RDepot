version: '3'
services:
  ##
  crane:
    image: registry.openanalytics.eu/openanalytics/crane:1.0.0
    restart: always
    hostname: oa-rdepot-crane
    volumes:
      - repository:/srv/crane
      - ./docker/crane/application.yml:/opt/crane/application.yml
    networks:
      oa-rdepot:
        aliases:
          - oa-rdepot-crane
    ports:
      - 8030:8080
      - 8032:8001
    environment:
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8001
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:8080/repo -H 'Accept: application/json' -I 2>/dev/null | grep 'HTTP/1.1' | cut -d' ' -f2 | grep 302 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    depends_on:
      keycloak:
        condition: service_healthy
  ##
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.2
    restart: unless-stopped
    hostname: oa-rdepot-keycloak
    command: start-dev --import-realm --hostname=http://192.168.49.17:8080
    ports:
      - 8031:8080
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=testpassword
      - KC_HEALTH_ENABLED=true
    volumes:
      - ./docker/keycloak/realm-rdepot.json:/opt/keycloak/data/import/realm-rdepot.json:ro
    networks:
      oa-rdepot:
        ipv4_address: 192.168.49.17
        aliases:
          - oa-rdepot-keycloak
    healthcheck:
      test: ["CMD-SHELL", "exec 3>/dev/tcp/127.0.0.1/9000;echo -e \"GET /health/ready HTTP/1.1\r\nhost: http://localhost\r\nConnection: close\r\n\r\n\" >&3;grep \"HTTP/1.1 200 OK\" <&3"]
      interval: 10s
      timeout: 10s
      retries: 10
  ##
  proxy:
    image: registry.openanalytics.eu/proxy/library/nginx:alpine
    restart: always
    hostname: oa-rdepot-proxy
    labels:
      eu.openanalytics.rdepot.container.name: "oa-rdepot-proxy"
    volumes:
      - ./docker/proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/proxy/sites-enabled/rdepot:/etc/nginx/sites-enabled/rdepot:ro
    ports:
      - 8017:80
      - 8021:90
      - 8023:95
    depends_on:
      app:
        condition: service_healthy
      crane:
        condition: service_healthy
    networks:
      oa-rdepot:
        aliases:
          - oa-rdepot-proxy
  ##
  repo:
    build: ./docker/repo
    restart: always
    labels:
      eu.openanalytics.rdepot.container.name: "oa-rdepot-repo"
    hostname: oa-rdepot-repo
    volumes:
      - ./docker/repo/rdepot-repo.jar:/opt/repo/rdepot-repo.jar:ro
      - ./docker/repo/test_configs/application.yml:/opt/repo/application.yml
      - repository:/opt/rdepot/
      - ./itestServer:/opt/testServer
    environment:
      - JAVA_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8001
    ports:
      - 8020:8001
    networks:
      oa-rdepot:
        aliases:
          - oa-rdepot-repo
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health -H 'Accept: application/json' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 100
  db:
    image: registry.openanalytics.eu/proxy/library/postgres:alpine
    labels:
      eu.openanalytics.rdepot.container.name: "oa-rdepot-db"
    restart: always
    hostname: oa-rdepot-db
    volumes:
      - ./docker/db/initial_scripts/:/docker-entrypoint-initdb.d/:ro
      - ./docker/db/sql_files/:/opt/sql_files/:ro
    environment:
      - POSTGRES_PASSWORD=mysecretpassword
    networks:
      oa-rdepot:
        aliases:
          - oa-rdepot-db
    ports:
      - 5432:5432
  ##
  app:
    build: ./docker/app
    restart: always
    hostname: oa-rdepot-app
    labels:
      eu.openanalytics.rdepot.container.name: "oa-rdepot-app"
    volumes:
      - ./docker/app/test_configs/test_simple_config.yml:/opt/rdepot/application.yml
      - ./docker/app/rdepot.war:/opt/rdepot/rdepot.war:ro
      - ./docker/app/rdepot.conf:/opt/rdepot/rdepot.conf:ro
      - ./itestSourceFiles:/opt/testSourceFiles:ro
      - ./itestGenerated:/opt/testGenerated:ro
      - ./itestNewFiles:/opt/newFiles:ro
      - ./itestTrashFiles:/opt/trashFiles:ro
    ports:
      - 8001:8001
      - 8018:8080
      - 8019:8001
    depends_on:
      repo:
        condition: service_healthy
      db:
        condition: service_started
    environment:
      - DB_URL=jdbc:postgresql://oa-rdepot-db:5432/rdepot
      - DB_USERNAME=postgres
      - JAVA_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8001
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health -H 'Accept: application/json' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 100
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      oa-rdepot:
        aliases:
          - oa-rdepot-app
        ipv4_address: 192.168.49.21
  ##
  r-test-container:
    build: ./docker/r
    stdin_open: true
    hostname: oa-rdepot-r-test-container
    labels:
      eu.openanalytics.rdepot.container.name: "oa-rdepot-r-test-container"
    networks:
      oa-rdepot:
        aliases:
          - oa-rdepot-r-test-container
    volumes:
      - ./itestRepo:/opt/itestRepo:ro
  python-test-container:
    image: registry.openanalytics.eu/proxy/python:3.9.19
    working_dir: /opt/itestRepo
    stdin_open: true
    hostname: oa-rdepot-python-test-container
    labels:
      eu.openanalytics.rdepot.container.name: "oa-rdepot-python-test-container"
    networks:
      oa-rdepot:
        aliases:
          - oa-rdepot-python-test-container
    volumes:
      - ./itestRepo:/opt/itestRepo:ro
networks:
  oa-rdepot:
    ipam:
      config:
        - subnet: 192.168.49.0/24
volumes:
  repository:
