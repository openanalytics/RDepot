name: ZG-Partially-Broken
publicationUri: http://localhost/repo/ZG-Partially-Broken
serverAddress: http://oa-rdepot-repo:8080/ZG-Partially-Broken
published: true
requiresAuthentication: true
mirrors:
  - name: CRAN
    uri: https://cran.r-project.org
    syncInterval: ""
    type: tarball
    generateManuals: true
    packages:
      - name: ggplot2
        version: 3.3.2
      - name: plotly
        version: 4.11.0
        generateManuals: false
      - name: nonexistingpackage
        version: 1.2.3
  - name: Bioconductor-3.12
    uri: http://archive.bioconductor.org.s3-website-us-east-1.amazonaws.com/packages/3.12/bioc
    syncInterval: ""
    type: tarball
    generateManuals: false
    packages:
      - name: annotate
        version: 1.68.0
  - name: Bioconductor-release
    uri: https://bioconductor.org/packages/release/bioc
    syncInterval: ""
    type: tarball
    packages:
      - name: Banksy
        version: 1.7.0
