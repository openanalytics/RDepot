api-token:
  secret: SecretKeyToGenJWTs
  issuer: RDepot
  audience:
    - RDepot
  lifetime: 5000

allowed-origin: http://localhost:3001

repository-snapshots: true
check-manuals: false

replacing:
  packages:
    enabled: true
deleting:
  repositories:
    enabled: true
  packages:
    enabled: true

default-user-configuration:
  language: en-US
  theme: light
  page-size: 10
  supported-languages:
    - en-US
    - de-DE
    - nl-NL
    - pl-PL
    - fr-FR
  supported-themes:
    - light
    - dark

declarative: false
#repositories:
#  - name: A
#    publication-uri: http://localhost/repo/A13
#    server-address: http://oa-rdepot-repo:8080/A13
#  - name: D
#    publication-uri: http://localhost/repo/D
#    server-address: http://oa-rdepot-repo:8080/D

# Email related properties
spring:
  mail:
    enabled: false
    password: mysecretpassword
    username: rdepot
    host: 192.168.49.1
    port: 3925
  security:
    oauth2:
      client:
        # Configuration of external IDP (e.g. Keycloak, Azure AD ...)
        # Note SecurityConfig.java:40 contains the ID (rdepot) of this client
        registration:
          rdepot:
            provider: rdepot
            client-authentication-method: client_secret_basic
            client-secret: mEXw8iqcOlxWvC6Jsczt7yix6ilWzHPf
            client-id: rdepot
            scope: openid,profile,email
        provider:
          rdepot:
            issuer-uri: http://192.168.49.17:8080/realms/RDepot
      authorizationserver:
        issuer: http://192.168.49.21:8080
        client:
          device-code:
            registration:
              client-id: "device-code"
              client-authentication-methods:
                - "none"
              authorization-grant-types:
                - "refresh_token"
                - "urn:ietf:params:oauth:grant-type:device_code"
              redirect-uris:
                - "http://192.168.49.21:8080/login/oauth2/code/rdepot"
                - "http://192.168.49.21:8080/oauth2/authorized"
                - "http://192.168.49.21:8080/oauth2/authorize"
              post-logout-redirect-uris:
                - "http://192.168.49.21:8080/logged-out"
              scopes:
                - "openid"
                - "email"
                - "profile"
                - "message.read"
                - "message.write"
            require-authorization-consent: true
          crane:
            registration:
              client-id: "crane"
              client-secret: "{noop}secret"
              client-authentication-methods:
                - "client_secret_basic"
              authorization-grant-types:
                - "authorization_code"
                - "refresh_token"
                - "client_credentials"
                - "urn:ietf:params:oauth:grant-type:device_code"
              redirect-uris:
                - "http://192.168.49.25:8080/login/oauth2/code/crane"
                - "http://192.168.49.25:8080/oauth2/authorized"
              post-logout-redirect-uris:
                - "http://192.168.49.25:8080/logged-out"
              scopes:
                - "openid"
                - "email"
                - "profile"
                - "message.read"
                - "message.write"
            require-authorization-consent: true
            require-proof-key: false

  # Enable Liquibase
  liquibase:
    user: postgres
    enabled: true

#Logging
#logging:
#  level:
#    org:
#      hibernate:
#        SQL: TRACE
#        orm:
#          jdbc:
#            bind: TRACE

oauth2:
  authorizationserver: true
  jwk-set-uri: http://192.168.49.17:8080/realms/RDepot/protocol/openid-connect/certs
  login-field: preferred_username
  email-field: email
  full-name-field: name
  groups-field: groups
  jwt-types:
    - application/okta-internal-at+jwt
    - JOSE
    - JWT

# Authentication related properties
app:
  authentication: oauth2
  oauth2:
    default:
      admins:
        - einstein
  simple:
    users:
      - login: einstein
        password: testpassword
        name: Albert Einstein
      - login: tesla
        password: testpassword
        name: Nicolas Tesla
      - login: galieleo
        password: testpassword
        name: Galileo Galilei
      - login: newton
        password: testpassword
        name: Isaac Newton
      - login: newbie
        password: testpassword
        name: New User
      - login: doe
        password: testpassword
        name: John Doe
    default:
      admins:
        - einstein

# Database related properties
db:
  driver: org.postgresql.Driver
  url: jdbc:postgresql://oa-rdepot-db:5432/rdepot
  username: rdepot
  password: mysecretpassword

# Hibernate related properties
hibernate:
  dialect: org.hibernate.dialect.PostgreSQLDialect
  show_sql: false
