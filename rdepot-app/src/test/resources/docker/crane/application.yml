      read-access:
        public: true
    testrepo4:
      rewrites:
        - matcher: "#{parse('.*R \\((\\d+\\.\\d+)[^ ]* ([^ ]+) ([^ ]+) ([^ ]+)\\)', request.getHeader('User-Agent')) && parse('/linux/([^/]+)/src/contrib/(.+)', path.toString())}"
          destination: "/testrepo4/bin/linux/#{parsed[1].group(1)}/#{parsed[0].group(3)}/#{parsed[0].group(1)}/#{parsed[1].group(2)}"
      read-access:
