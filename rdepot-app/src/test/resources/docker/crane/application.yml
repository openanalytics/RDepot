app:
  openid-groups-claim: "groups"
  openid-issuer-uri: "http://192.168.49.17:8080/realms/RDepot"
  storage-location: "/srv/crane/"
  repositories:
    testrepo1:
      rewrites:
        - matcher: "#{parse('.*R \\((\\d+\\.\\d+)[^ ]* ([^ ]+) ([^ ]+) ([^ ]+)\\)', request.getHeader('User-Agent')) && parse('/linux/([^/]+)/src/contrib/(.+)', path.toString())}"
          destination: "/testrepo1/bin/linux/#{parsed[1].group(1)}/#{parsed[0].group(3)}/#{parsed[0].group(1)}/#{parsed[1].group(2)}"
      on-error-expression: "#{response.status == 404 && parse('R \\((\\d+\\.\\d+)[^ ]* ([^ ]+) ([^ ]+) ([^ ]+)\\)', request.getHeader('User-Agent')) && parse('/repo/__file/testrepo1/bin/linux/([^/]+)/([^/]+)/([^/]+)/([^/]+)', request.getRequestURI().toString()) ? eval(true, request.getRequestDispatcher('/testrepo1/src/contrib/' + parsed[1].group(4)).forward(request, response)) : false}"
      read-access:
        public: true
    testrepo2:
      rewrites:
        - matcher: "#{parse('.*R \\((\\d+\\.\\d+)[^ ]* ([^ ]+) ([^ ]+) ([^ ]+)\\)', request.getHeader('User-Agent')) && parse('/linux/([^/]+)/src/contrib/(.+)', path.toString())}"
          destination: "/testrepo2/bin/linux/#{parsed[1].group(1)}/#{parsed[0].group(3)}/#{parsed[0].group(1)}/#{parsed[1].group(2)}"
      read-access:
        public: true
    testrepo3:
