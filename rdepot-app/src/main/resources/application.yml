---
api-token:
  secret: SecretKeyToGenJWTsButItShouldBeReplaced

access-token:
  lifetime-default: 30
  lifetime-configurable: true
  length: 32
  allowed-characters: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789

on-start-up:
  check-manuals: false

generate-manuals: true

declarative: false
deleting:
  repositories:
    enabled: true
  packages:
    enabled: true

repository-snapshots: false

default-user-configuration:
  language: en-US
  theme: light
  page-size: 10
  supported-languages:
    - en-US
    - de-DE
    - nl-NL
    - pl-PL
  supported-themes:
    - light
    - dark

replacing:
  packages:
    enabled: true

# Email related properties
#email:
#  enabled: false
#  password:
#  username:
#  from:
#  smtp:
#    host:
#    port:
#    auth:
#    starttls:

# Authentication related properties
oauth2:
  #  jwk-set-uri: http://localhost/auth/realms/RDepot/protocol/openid-connect/certs
  login-field: preferred_username
  email-field: email
  full-name-field: name
  jwt-types:
    - JWT
    - JOSE

app:
  authentication: simple
  simple:
    users:
      - login: einstein
        password: testpassword
        name: Albert Einstein
      - login: tesla
        password: testpassword
        name: Nicolas Tesla
      - login: galieleo
        password: testpassword
        name: Galileo Galilei
      - login: newton
        password: testpassword
        name: Isaac Newton
      - login: newbie
        password: testpassword
        name: New User
      - login: doe
        password: testpassword
        name: John Doe
    default:
      admins:
        - einstein

# Database related properties
db:
  driver: org.postgresql.Driver
  url: jdbc:postgresql://oa-rdepot-db:5432/rdepot
  username: rdepot
  password: mysecretpassword

# Hibernate related properties
hibernate:
  dialect: org.hibernate.dialect.PostgreSQLDialect
  show_sql: false

message:
  source:
    basename: i18n/messages

entitymanager:
  packages:
    to:
      scan:
        - eu.openanalytics.rdepot.base.entities
        - eu.openanalytics.rdepot.r.entities
        - eu.openanalytics.rdepot.python.entities

# Package upload related properties
package:
  version:
    max-numbers: 10
  upload:
    dir: /opt/rdepot
  rVersions:
    - 3.6
    - 4.0
    - 4.1
    - 4.2
    - 4.3
    - 4.4
    - 4.5
  architectures:
    - x86_64
    - x86
    - aarch64
  distributions:
    - centos7
    - centos8
    - rhel9
    - rhel10
    - opensuse155
    - opensuse156
    - focal
    - jammy
    - noble
    - bullseye
    - bookworm
  python:
    hashFunctions:
      - md5
      - sha1
      - sha224
      - sha256
      - sha384
      - sha512
  r:
    encoding: "[A-Za-a0-9-_.,+:=]+"

# Repository related properties
repository:
  # Repository API related properties
  api:
    # Repository API authentication
    authentication: none  # none or simple
  # Repository generation related properties
  generation:
    # Local directory used when generating the repository files
    dir: /opt/rdepot/generated
  # Regular expressions for repository name validation
  validation-name-regex:
    # Fallback regular expression when a technology-specific regular expression is not present
    general: ".+"
    # Regular expressions based on technology
    technology:
      # Regular expression for validating Python repository names
      python: "^[A-Za-z0-9\\-_.~]+$"
      # Regular expression for validating R repository names
      r: "^[A-Za-z0-9 \\-_.]+$"
  # Files allowed to be uploaded per technology
  allowed-files:
    # Allowed files for Python repositories
    python:
      # Source packages
      - mimetype: application/gzip
        extension: .tar.gz
      # Source packages
      - mimetype: application/x-gzip
        extension: .tar.gz
      # Binary (wheel) packages
      - mimetype: application/octet-stream
        extension: .whl
    # Allowed files for R repositories
    r:
      # Source and binary packages
      - mimetype: application/gzip
        extension: .tar.gz
      # Source and binary packages
      - mimetype: application/x-gzip
        extension: .tar.gz

#spring.mvc.view.prefix=/WEB-INF/pages/
#spring.mvc.view.suffix=.jsp
spring:
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 1000MB
  mvc:
    view:
      suffix: .html
  main:
    allow-bean-definition-overriding: true
    log-startup-info: false
  output:
    ansi:
      enabled: always

  # Liquibase related properties
  liquibase:
    # change-log: classpath:liquibase-changeLog.xml
    url: jdbc:postgresql://oa-rdepot-db:5432/rdepot
    user: postgres
    password: mysecretpassword
    enabled: true

#spring.devtools.remote.secret=thisismysecret
server:
  error:
    include-stacktrace: never
    path: /error

error:
  whitelabel:
    enabled: false

management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: "health"
  endpoint:
    health:
      enabled: true
  metrics:
    web:
      server:
        request:
          autotime:
            enabled: false
springdoc:
  pathsToMatch: /api/v2/**
  api-docs:
    path: /v2/api-docs
  swagger-ui:
    path: /docs/api.html
    disable-swagger-default-url: true
    url: /v2/api-docs
    display-query-params: true
  default-produces-media-type: application/json

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-4r [%t] %5p traceId=%X{traceIdMDC} %c{1} : %m %n"
  level:
    liquibase:
      parser: INFO
    org:
      springframework:
        web:
          filter:
            CommonsRequestLoggingFilter: INFO

multipart-upload:
  max-part-count: 15
  max-part-header-size: 1024

#storage related properties
local-storage:
  max-request-size: 15

storage:
  implementation: local
